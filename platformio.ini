; PlatformIO - Autorama (ESP32-C3 SuperMini)
; ------------------------------------------------------------------
; Usa a plataforma "pioarduino" porque a oficial do PlatformIO ainda
; usa o Arduino-ESP32 2.x, que NAO tem ledcAttach(pin,freq,res).
; A pioarduino entrega o core 3.x (necessario p/ este codigo).
;
; USB CDC On Boot fica LIGADO pelas build_flags abaixo -> o Serial
; aparece pelo cabo USB sem precisar mexer em menu nenhum.

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
